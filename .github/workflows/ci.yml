# Official package mirror CI — LLVM 22 via ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main

      - name: Enforce def syntax (no bare proc)
        run: |
          set -euo pipefail
          bash lic/scripts/check-li-def-syntax.sh src
          if [[ -d li-tests ]]; then
            bash lic/scripts/check-li-def-syntax.sh li-tests
          fi

      - name: Build lic
        working-directory: lic
        run: |
          chmod +x scripts/build.sh 2>/dev/null || true
          ./scripts/build.sh

      - name: lic check + smoke
        env:
          LIC: ${{ github.workspace }}/lic/build/compiler/lic/lic
        run: |
          set -euo pipefail
          test -x "$LIC"
          LEAN_FLAGS=()
          if ! command -v lake >/dev/null 2>&1; then
            LEAN_FLAGS+=(--no-lean-verify)
          fi
          "$LIC" check "${LEAN_FLAGS[@]}" src/lib.li
          if [[ -f li-tests/smoke/builds.li ]]; then
            "$LIC" build "${LEAN_FLAGS[@]}" li-tests/smoke/builds.li -o /dev/null
          fi
