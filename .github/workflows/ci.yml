# Official package mirror CI — required for every li-langverse package repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main

      - name: Enforce def syntax (no bare proc)
        run: |
          set -euo pipefail
          chmod +x lic/scripts/check-li-def-syntax.sh
          lic/scripts/check-li-def-syntax.sh src
          if [[ -d li-tests ]]; then
            lic/scripts/check-li-def-syntax.sh li-tests
          fi

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          # Ubuntu runners don't ship clang-22 by default; install via apt.llvm.org.
          sudo apt-get install -y ca-certificates wget gnupg lsb-release software-properties-common
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          sudo apt-get install -y cmake ninja-build zlib1g-dev libzstd-dev python3

      - name: Build lic
        working-directory: lic
        env:
          LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
          CC: clang-22
          CXX: clang++-22
        run: |
          chmod +x scripts/build.sh scripts/resolve-lic.sh 2>/dev/null || chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: lic check + smoke
        env:
          LIC: ${{ github.workspace }}/lic/build/compiler/lic/lic
        run: |
          test -x "$LIC"
          "$LIC" check src/lib.li
          if [[ -f li-tests/smoke/builds.li ]]; then
            "$LIC" build li-tests/smoke/builds.li -o /dev/null
          fi
